[build]
builder = "NIXPACKS"

# ── Backend API ────────────────────────────────────────────────
[[services]]
name = "brandora-backend"
source = "./backend"

[services.build]
buildCommand = "pip install -r requirements.txt && alembic upgrade head"

[services.deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --worker-class uvicorn.workers.UvicornWorker"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.variables]
ENVIRONMENT = "production"
PORT = "8000"

# ── Celery Worker ─────────────────────────────────────────────
[[services]]
name = "brandora-celery"
source = "./backend"

[services.build]
buildCommand = "pip install -r requirements.txt"

[services.deploy]
startCommand = "celery -A app.workers.celery_app worker --loglevel=info -Q content,scheduler,analytics,default --concurrency=2 --max-tasks-per-child=500"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.variables]
ENVIRONMENT = "production"

# ── Celery Beat Scheduler ─────────────────────────────────────
[[services]]
name = "brandora-celery-beat"
source = "./backend"

[services.build]
buildCommand = "pip install -r requirements.txt"

[services.deploy]
startCommand = "celery -A app.workers.celery_app beat --loglevel=info"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[services.variables]
ENVIRONMENT = "production"

# ── Frontend ──────────────────────────────────────────────────
[[services]]
name = "brandora-frontend"
source = "./frontend"

[services.build]
buildCommand = "npm ci && npm run build"

[services.deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.variables]
NODE_ENV = "production"
PORT = "3000"
