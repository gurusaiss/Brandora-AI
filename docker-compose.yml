services:
  postgres:
    image: postgres:16-alpine
    container_name: brandora_postgres
    environment:
      POSTGRES_DB: brandora_ai
      POSTGRES_USER: brandora
      POSTGRES_PASSWORD: brandora_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/alembic/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandora -d brandora_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: brandora_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: brandora_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./.env                     # ← single root .env for all services
    environment:
      # Override connection strings to use Docker service names
      - DATABASE_URL=postgresql+asyncpg://brandora:brandora_dev_password@postgres:5432/brandora_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: brandora_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info -Q content,scheduler,analytics,default --concurrency=4
    volumes:
      - ./backend:/app
    env_file:
      - ./.env                     # ← single root .env for all services
    environment:
      - DATABASE_URL=postgresql+asyncpg://brandora:brandora_dev_password@postgres:5432/brandora_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: brandora_celery_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./.env                     # ← single root .env for all services
    environment:
      - DATABASE_URL=postgresql+asyncpg://brandora:brandora_dev_password@postgres:5432/brandora_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: brandora_flower
    command: celery -A app.workers.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    env_file:
      - ./.env                     # ← single root .env for all services
    environment:
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: brandora_frontend
    command: npx next dev --hostname 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./.env                     # ← single root .env (NEXT_PUBLIC_* injected from here)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
