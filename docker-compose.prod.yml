version: '3.9'

# Production overrides — use with:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    # No ports exposed externally — accessed only by internal services

  redis:
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    # No source-code volume mounts in production
    volumes: []
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --no-access-log
    environment:
      - ENVIRONMENT=production
    env_file:
      - ./backend/.env.production
    ports: []   # exposed only through nginx
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    volumes: []
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=warning
      -Q content,scheduler,analytics,default
      --concurrency=4
      --max-tasks-per-child=500
    env_file:
      - ./backend/.env.production
    environment:
      - ENVIRONMENT=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    volumes: []
    command: celery -A app.workers.celery_app beat --loglevel=warning
    env_file:
      - ./backend/.env.production
    environment:
      - ENVIRONMENT=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  flower:
    # Disable Flower in production by default — enable only for debugging
    profiles:
      - debug
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    volumes: []
    command: >
      celery -A app.workers.celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    env_file:
      - ./backend/.env.production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    volumes: []
    # Production Next.js runs with `npm start` after `npm run build`
    command: npm start
    environment:
      - NODE_ENV=production
    env_file:
      - ./frontend/.env.production
    ports: []   # exposed only through nginx
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: brandora_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
